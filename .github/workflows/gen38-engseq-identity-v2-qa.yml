name: gen38-engseq-identity-v2-code-only-qa
on:
  pull_request:
    branches: [main]
    paths:
      - 'broker/gen34_r25r7_bridge.py'
      - 'broker/engseq_identity_registry_v2.py'
      - 'broker/engseq_registry_v2_broker_glue.py'
      - 'tests/test_engseq_identity_v2.py'
      - 'scripts/ci_validate_pr.py'
      - '.github/workflows/gen38-engseq-identity-v2-qa.yml'
      - 'request/ACTION_REQUEST.json'
permissions:
  contents: read
jobs:
  identity-v2-code-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout unprivileged proposal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: New/affected Identity v2 tests, no private inputs
        run: python -I -B -m unittest discover -s tests -p 'test_engseq_identity_v2.py' -v
      - name: Gate/authority regression for modified validator
        run: python -I -B scripts/selftest.py
