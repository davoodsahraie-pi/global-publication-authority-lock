# PROPOSAL ONLY - DO NOT ADD TO PROTECTED REPO WITHOUT NEW EXPLICIT AUTHORIZATION
name: gen32-cloud-sentinel-local-only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gen32-sentinel-local-only
  cancel-in-progress: false
jobs:
  sqlite-ephemeral-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic sentinel only
        run: python -I -B scripts/gen32_cloud_sentinel.py selftest
