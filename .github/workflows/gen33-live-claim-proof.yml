name: gen33-live-claim-proof
on:
  pull_request:
    branches: [ main ]
    paths:
      - "broker/gen33_live_claim.py"
      - "broker/gen33_source_bound_broker.py"
      - "tests/test_gen33_live_claim.py"
      - ".github/workflows/gen33-live-claim-proof.yml"
      - ".github/workflows/gen33-broker-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nonproducer-protected-claim-proof:
    name: gen33-protected-claim-proof-no-write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exactly workflow SHA without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run simulated protected-claim adversarial tests
        run: python -I -B -m unittest discover -s tests -p 'test_gen33_live_claim.py' -v
      - name: Demonstrate fail-closed offline claim observation
        run: python -B broker/gen33_live_claim.py --mode offline
      - name: Fail-closed code compilation (no Producer)
        run: python -I -B -m py_compile broker/gen33_source_bound_broker.py broker/gen33_live_claim.py tests/test_gen33_live_claim.py
