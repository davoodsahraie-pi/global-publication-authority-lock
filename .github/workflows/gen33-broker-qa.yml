name: gen33-broker-qa
on:
  pull_request:
    branches: [ main ]
    paths:
      - "broker/**"
      - "tests/test_gen33_broker.py"
      - ".github/workflows/gen33-broker-qa.yml"
      - "gate/**"
      - "scripts/**"
      - "request/ACTION_REQUEST.json"
permissions:
  contents: read
jobs:
  broker-code-only-qa:
    name: gen33-broker-code-only-qa
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout unprivileged PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic-only Broker tests
        run: python -I -B -m unittest discover -s tests -p 'test_gen33_broker.py' -v
      - name: Verify code-only imports never spawn or access secrets
        run: python -I -B -m py_compile broker/gen33_source_bound_broker.py broker/gen33_receipt_verifier.py tests/test_gen33_broker.py
