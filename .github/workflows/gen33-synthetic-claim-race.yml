name: gen33-synthetic-claim-race
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gen33-synthetic-claim-race.yml
      - scripts/gen33_synthetic_claim_race.py
      - tests/test_gen33_synthetic_claim_race.py
      - scripts/ci_validate_pr.py
      - request/ACTION_REQUEST.json
  workflow_dispatch:
    inputs:
      owner_authorization_run_id:
        description: 'Fresh separately approved synthetic-claim-only owner authorization run. CODE INSTALL GRANT WILL BE DENIED.'
        required: true
        type: string
permissions:
  contents: read
  actions: read

jobs:
  offline-pr-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic-only owner-grant and Git ref simulations
        run: python -I -B -m unittest discover -s tests -p 'test_gen33_synthetic_claim_race.py' -v
      - name: Compile only newly authored code
        run: python -I -B -m py_compile scripts/gen33_synthetic_claim_race.py tests/test_gen33_synthetic_claim_race.py
  protected-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require NEW distinct physical-only owner authorization and exact Ruleset
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_AUTH_RUN_ID: ${{ inputs.owner_authorization_run_id }}
        run: python -I -B scripts/gen33_synthetic_claim_race.py preflight
  contender-a:
    if: github.event_name == 'workflow_dispatch'
    needs: [protected-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    outputs:
      outcome: ${{ steps.claim.outputs.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: claim
        name: Competing synthetic-only Git tag claim A (one POST, no retry)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_AUTH_RUN_ID: ${{ inputs.owner_authorization_run_id }}
        run: python -I -B scripts/gen33_synthetic_claim_race.py claim
  contender-b:
    if: github.event_name == 'workflow_dispatch'
    needs: [protected-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    outputs:
      outcome: ${{ steps.claim.outputs.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: claim
        name: Competing synthetic-only Git tag claim B (one POST, no retry)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_AUTH_RUN_ID: ${{ inputs.owner_authorization_run_id }}
        run: python -I -B scripts/gen33_synthetic_claim_race.py claim
  independent-verify:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [protected-preflight, contender-a, contender-b]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent Git tag readback, exactly one winner, no Producer
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_AUTH_RUN_ID: ${{ inputs.owner_authorization_run_id }}
          PREFLIGHT: ${{ needs.protected-preflight.result }}
          OUTCOME_A: ${{ needs.contender-a.outputs.outcome }}
          OUTCOME_B: ${{ needs.contender-b.outputs.outcome }}
        run: python -I -B scripts/gen33_synthetic_claim_race.py verify
