name: gen34-r25r7-producer
on:
  workflow_dispatch:
    inputs:
      owner_authorization_run_id:
        description: Separate owner EXECUTE authorization for the current activated authority
        required: true
        type: string
permissions:
  contents: read
jobs:
  source-bound-driver:
    if: github.repository == 'davoodsahraie-pi/global-publication-authority-lock' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1
    environment: gen34-r25r7-production
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    permissions:
      contents: write
      actions: read
      deployments: read
    steps:
      - name: Checkout the exact protected execution commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Authenticated source-bound Broker to original Driver
        env:
          GH_TOKEN: ${{ github.token }}
          GEN34_PRIVATE_TOKEN: ${{ secrets.GEN34_PRIVATE_TOKEN }}
          GEN34_RECEIPT_KEY_HEX: ${{ secrets.GEN34_RECEIPT_KEY_HEX }}
          OWNER_AUTHORIZATION_RUN_ID: ${{ inputs.owner_authorization_run_id }}
        run: python -I -B broker/gen34_r25r7_bridge.py --authorization-run-id "$OWNER_AUTHORIZATION_RUN_ID"
