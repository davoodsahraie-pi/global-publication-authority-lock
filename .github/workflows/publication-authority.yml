name: publication-authority
on:
  pull_request_target:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  authority-gate:
    name: publication-authority
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1

      - name: Checkout proposal as untrusted data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Trusted base self-test
        run: python base/scripts/selftest.py

      - name: Validate proposal with trusted base code
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python base/scripts/ci_validate_pr.py --base base --head head
